networks:
  ai-net:
    external: true
services:
  opencode-agent:
    # user: "${UID:-1000}:${GID:-1000}" # Needs to run as the same user as the host to avoid permission issues with mounted volumes
    networks:
      - ai-net
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode-agent
    working_dir: /workspace
    tty: true
    stdin_open: true
    volumes:
      # Mounts the host's source code directory to the container's workspace, allowing the agent to access and modify files.
      - /home/base/src:/workspace

      # Montera de tre specifika filerna till /home/ubuntu/.config/opencode/
      # - /home/base/.config/opencode/CODING_GUIDELINES.md:/home/ubuntu/.config/opencode/CODING_GUIDELINES.md:ro
      # - /home/base/.config/opencode/AGENTS.md:/home/ubuntu/.config/opencode/AGENTS.md:ro
      # - /home/base/.config/opencode/opencode.jsonc:/home/ubuntu/.config/opencode/opencode.jsonc:ro

      # Mounts the host's OpenCode configuration and data directories to the container, ensuring that settings and data persist across container restarts.
      - /home/base/.config/opencode:/home/ubuntu/.config/opencode

      # Mounts the host's OpenCode data directory to the container, allowing the agent to access and store data persistently.
      - /home/base/.local/share/opencode:/home/ubuntu/.local/share/opencode

      # Maps opencodes data (for example auth.json if you run 'opencode auth login')
      # Not needed for local LLM usage, but useful if you want to use OpenCode's cloud features.
      # - ${HOME}/.local/share/opencode:/home/appuser/.local/share/opencode
    #environment:
      # Configure the OpenCode agent to use the Lemonade server running on the host machine.
      # - OPENAI_BASE_URL=http://host.docker.internal:13305/v1
      # - OPENAI_API_KEY=lemonade
    # extra_hosts:
      # Make the host machine accessible from within the container, allowing the agent to communicate with services running on the host.
      # ONLY NEEDED IF LEMONADE SERVER RUNNING LOCALLY ON HOST MACHINE (This is a potential security risk if you don't know what you're doing, so use with caution).
      # Set the following for host access: - "host.docker.internal:host-gateway"