image: mcr.microsoft.com/dotnet/sdk:10.0
user: ubuntu # by default rullar msb annars som root, vilket inte är bra för OpenCode volume access.
workdir: /workspace
memory: "4096"  # Ger 4 GB RAM
cpus: 2        # Ger 2 CPU-kärnor
env:
  OPENAI_BASE_URL: http://192.168.50.142:13305/v1
  OPENAI_API_BASE: http://192.168.50.142:13305/v1
  OPENAI_API_KEY: lemonade
network:
  allow:
    # Nödvändigt för apt-get (Ubuntu)
    - archive.ubuntu.com
    - security.ubuntu.com
    
    # Nödvändigt för Node/npm, .NET och GitHub
    - deb.nodesource.com
    - registry.npmjs.org
    - api.nuget.org
    - github.com
    - raw.githubusercontent.com
    
    # Din lokala AI-värd
    - 192.168.50.142 
scripts:
  setup: |
    # 1. Uppdatera och installera grundverktyg (+ Python som agenter ofta behöver)
    apt-get update 
    apt-get install -y --no-install-recommends curl git jq procps gosu ca-certificates python3 python3-pip
    
    # 2. Installera Node.js
    curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    apt-get install -y --no-install-recommends nodejs
    
    # 3. Rensa apt-cache för att spara utrymme
    rm -rf /var/lib/apt/lists/*
    
    # 4. Installera OpenCode
    npm install -g opencode-ai
    
    # 5. Skapa nödvändiga mappar och sätt rättigheter för användare 1000
    mkdir -p /home/ubuntu/.local/share/opencode \
             /home/ubuntu/.local/state \
             /home/ubuntu/.config/opencode \
             /workspace
    chown -hR 1000:1000 /home/ubuntu 2>/dev/null || true

# export TERM=xterm-256color # under start
  start: |
    
    export DOTNET_CLI_TELEMETRY_OPTOUT=1
    export DOTNET_NOLOGO=true
    export DOTNET_USE_POLLING_FILE_WATCHER=true
    export ASPNETCORE_ENVIRONMENT=Development
    export OPENCODE_CONFIG_DIR=/home/ubuntu/.config/opencode

    # Startar en bash-session som standard. 
    # Ändra /bin/bash till 'opencode' om du vill att agenten ska starta direkt.
    exec gosu 1000:1000 /bin/bash