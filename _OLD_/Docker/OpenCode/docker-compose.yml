services:
  opencode-agent:
    user: "${UID:-1000}:${GID:-1000}" # Needs to run as the same user as the host to avoid permission issues with mounted volumes
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode-agent
    working_dir: /workspace
    tty: true
    stdin_open: true
    volumes:
      # Mappar din lokala ./src-mapp till /workspace i containern
      - /home/base/src:/workspace
    environment:
      # Styr LLM-anropen till din lokala Lemonade-server på host-maskinen
      - OPENAI_BASE_URL=http://host.docker.internal:13305/v1
      - OPENAI_API_KEY=lemonade
    extra_hosts:
      # Gör så att containern kan prata med din dators localhost oavsett OS
      - "host.docker.internal:host-gateway"