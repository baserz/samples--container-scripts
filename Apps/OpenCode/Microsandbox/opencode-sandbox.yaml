image: mcr.microsoft.com/dotnet/sdk:10.0
workdir: /workspace
memory: "4096"
cpus: 2
env:
  OPENAI_BASE_URL: http://192.168.50.142:13305/v1
  OPENAI_API_BASE: http://192.168.50.142:13305/v1
  OPENAI_API_KEY: lemonade
network:
  allow:
    - archive.ubuntu.com
    - security.ubuntu.com
    - deb.nodesource.com
    - registry.npmjs.org
    - api.nuget.org
    - github.com
    - raw.githubusercontent.com
    - 192.168.50.142 
scripts:
  setup: |
    # 1. Uppdatera och installera grundverktyg 
    # (Tog bort 'gosu' härifrån eftersom vi kör som root)
    apt-get update 
    apt-get install -y --no-install-recommends curl git jq procps ca-certificates python3 python3-pip
    
    # 2. Installera Node.js
    curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    apt-get install -y --no-install-recommends nodejs
    
    # 3. Rensa apt-cache för att spara utrymme
    rm -rf /var/lib/apt/lists/*
    
    # 4. Installera OpenCode
    npm install -g opencode-ai
    
    # 5. Skapa nödvändiga mappar i root-katalogen
    # (Tog bort chown-kommandot helt)
    mkdir -p /root/.local/share/opencode \
             /root/.local/state \
             /root/.config/opencode \
             /workspace

  start: |
    export DOTNET_CLI_TELEMETRY_OPTOUT=1
    export DOTNET_NOLOGO=true
    export DOTNET_USE_POLLING_FILE_WATCHER=true
    export ASPNETCORE_ENVIRONMENT=Development
    
    # Peka om OpenCodes konfiguration till root
    export OPENCODE_CONFIG_DIR=/root/.config/opencode

    # Om opencode inte finns, kör setup-skriptet!
    if ! command -v opencode-ai &> /dev/null; then
        echo "Första uppstarten upptäckt. Kör setup-skriptet..."
        bash /.msb/scripts/setup
        echo "Installation klar!"

    # Startar en bash-session som root
    # (Bytte ut 'exec gosu 1000:1000 /bin/bash' mot bara /bin/bash)
    exec /bin/bash